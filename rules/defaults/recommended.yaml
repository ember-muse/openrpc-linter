description: "OpenRPC validation rules"
rules:
  info-description:
    description: "Info must have description. It supports markdown, and usually shows up in documentation. So make good use of it."
    given: "$.info.description"
    severity: "error"
    then:
      function: "truthy"
  info-license:
    description: "Info should declare a license."
    given: "$.info.license"
    severity: "warn"
    then:
      function: "truthy"
  method-summary:
    description: "Method should have a summary."
    given: "$.methods[*].summary"
    severity: "warn"
    then:
      function: "truthy"
  method-description:
    description: "Method must have description. It supports markdown, and usually shows up in documentation. So make good use of it."
    given: "$.methods[*].description"
    severity: "error"
    then:
      function: "truthy"
  method-errors:
    description: "Method must have errors."
    given: "$.methods[*].errors"
    severity: "error"
    then:
      function: "truthy"
  method-examples:
    description: "Method must have examples."
    given: "$.methods[*].examples"
    severity: "error"
    then:
      function: "truthy"
  result-description:
    description: "Result should have a description."
    given: "$.methods[*].result.description"
    severity: "warn"
    then:
      function: "truthy"
  tag-description:
    description: "Tag should have a description."
    given: "$.methods[*].tags[*].description"
    severity: "warn"
    then:
      function: "truthy"
  error-description:
    description: "Error should have a description."
    given: "$.methods[*].errors[*].description"
    severity: "warn"
    then:
      function: "truthy"
  example-description:
    description: "Example should have a description."
    given: "$.methods[*].examples[*].description"
    severity: "warn"
    then:
      function: "truthy"
  schema-title:
    description: "Schema should have a title. Generators use titles to derive variable and type names downstream."
    given: "$..schema.title"
    severity: "warn"
    then:
      function: "truthy"
  schema-description:
    description: "Schema should have a description."
    given: "$..schema.description"
    severity: "warn"
    then:
      function: "truthy"
  schema-type:
    description: "Schema should have a type (or a composition keyword like oneOf/anyOf/allOf/enum/const/$ref)."
    given: "$..schema"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        anyOf:
          - { required: ["type"] }
          - { required: ["oneOf"] }
          - { required: ["anyOf"] }
          - { required: ["allOf"] }
          - { required: ["enum"] }
          - { required: ["const"] }
          - { required: ["$ref"] }
  methods-non-empty:
    description: "Document should declare at least one method."
    given: "$.methods"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        type: "array"
        minItems: 1
  method-examples-min:
    description: "Method should have at least one example."
    given: "$.methods[*].examples"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        type: "array"
        minItems: 1
  param-count-limit:
    description: "Method should accept no more than four params."
    given: "$.methods[*].params"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        type: "array"
        maxItems: 4
  method-summary-length:
    description: "Method summary should be 120 characters or fewer."
    given: "$.methods[*].summary"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        type: "string"
        maxLength: 120
  param-summary-length:
    description: "Param summary should be 120 characters or fewer."
    given: "$.methods[*].params[*].summary"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        type: "string"
        maxLength: 120
