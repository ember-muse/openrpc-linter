name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and republish, e.g. v0.0.18. Leave empty for a normal release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # head_commit is null on workflow_dispatch, so contains() is false and the job runs.
    if: >-
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, '[no release]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Generate new tag
        id: tag
        if: ${{ !inputs.tag }}
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          DRY_RUN: false
          # Conventional commits:
          # fix: -> patch version
          # feat: -> minor version
          # BREAKING -> major version

      # Idempotent: .goreleaser.yaml sets release.mode: replace and
      # replace_existing_artifacts, so re-running against an existing tag
      # overwrites assets instead of failing with 422 already_exists.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Idempotent: publish.mjs skips any package@version already in the registry.
      # new_tag is only set when the tag action actually created a tag; on a
      # re-run of an already-tagged commit it reports `tag` instead.
      - name: Publish npm packages
        run: node npm/scripts/publish.mjs
        env:
          VERSION: ${{ inputs.tag || steps.tag.outputs.new_tag || steps.tag.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
